version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: friday
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: friday
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
